<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atles O11y V5 · Lectura i impressió</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{font:16px/1.6 'Segoe UI',Arial,sans-serif;color:#182a38;margin:0;background:#fff}.wrap{max-width:1000px;padding:40px;margin:auto}h1{font-size:38px;line-height:1.15;font-weight:500}h2{font-size:28px;line-height:1.2;font-weight:500}h3{font-size:20px;line-height:1.3;font-weight:600}a{color:#0757ed;overflow-wrap:anywhere}p,li{orphans:3;widows:3}header{border-bottom:1px solid #cfd9df;padding-bottom:24px;margin-bottom:25px}header img{width:76px}article{padding:28px 0;border-top:1px solid #182a38}.block{padding:18px 22px;border-left:3px solid #547360;background:#edf4ef;margin:22px 0}.block.explore{border-color:#77628e;background:#f3eef8}.base,.note{color:#52616d}.label{font-weight:600}.actions{display:flex;gap:14px;flex-wrap:wrap}button,.actions a{font:inherit;min-height:44px;background:white;border:1px solid #182a38;padding:10px 18px;text-decoration:none;color:#182a38;cursor:pointer}.source{break-inside:avoid;padding:12px 0;border-bottom:1px solid #cfd9df}.source h3{font-size:18px}.full>h3{margin-top:26px}h2,h3{break-after:avoid}.toc{columns:2;column-gap:30px}.toc li{break-inside:avoid;margin-bottom:9px}.card-reference{font-size:16px;color:#52616d;margin:0 0 10px}.relations{padding-left:20px}.relations li{margin:12px 0}.relations span{display:block;color:#52616d}.summary{font-size:20px}.criteria{padding-left:20px}.criteria li{margin-bottom:8px}
@media(max-width:600px){.wrap{padding:24px}.toc{columns:1}h1{font-size:32px}}
@page{size:A4;margin:17mm 16mm 19mm}
@media print{body{font-size:12pt;line-height:1.5}.wrap{padding:0;max-width:none}header h1{font-size:30pt}.actions{display:none}article{break-before:page;border-top:0;padding-top:0}.block{break-inside:avoid;padding:14px 18px;print-color-adjust:exact;-webkit-print-color-adjust:exact}.sources{break-before:page}.source{font-size:11pt}.toc{font-size:11pt;line-height:1.35}.toc li{margin-bottom:4px}.source h3{font-size:12pt}h2{font-size:22pt}h3{font-size:15pt}.summary{font-size:14pt}.card-reference{font-size:11pt}}
</style></head><body><main class="wrap" id="print-main"></main>
<script src="data.js"></script><script src="model.js"></script><script src="lenses-data.js"></script><script src="editorial-data.js"></script><script src="positive-context.js"></script><script src="reading.js"></script><script src="lenses.js"></script><script>
(()=>{
'use strict';
const L=window.AtlesLenses,R=window.AtlesReading,E=window.ATLES_EDITORIAL;L.sync(new URLSearchParams(location.search));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=window.ATLES_DATA.cards,byId=Object.fromEntries(all.map(c=>[c.id,c])),cards=all.filter(c=>L.visible(c)),fits=Object.fromEntries(window.ATLES_MODEL.cards.map(c=>[c.id,c]));
const used=new Set(cards.flatMap(c=>L.references(c))),sources=window.ATLES_DATA.sources.filter(s=>L.scope==='all'&&L.mode==='all'||used.has(s.id)),src=Object.fromEntries(sources.map(s=>[s.id,s]));
const title=c=>R?.title(c)||c.title;
function refs(c){return L.references(c).filter(id=>src[id]).map(id=>`<a href="#source-${id}">${esc(src[id].publisher+' · '+src[id].title)}</a>`).join('<br>');}
function relations(c){const items=E.cards[c.id]?.relations||c.dependencies.map(id=>({id,label:'Es relaciona amb',reason:''}));return items.length?`<ul class="relations">${items.filter(r=>byId[r.id]).map(r=>`<li>${esc(r.label||'Es relaciona amb')} <a href="${esc(cards.some(x=>x.id===r.id)?'#'+r.id:L.carry('index.html#card/'+r.id))}">${esc(title(byId[r.id]))}</a>${r.reason?`<span>${esc(r.reason)}</span>`:''}</li>`).join('')}</ul>`:'<p>El pilot permet concretar les connexions útils per al servei.</p>';}
function full(c){return `<section class="full"><h3>Oportunitat de millora</h3><p>${esc(c.problem)}</p><h3>La proposta de Villier</h3><p>${esc(c.proposal)}</p>${(c.addendum?.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}<h3>Com funciona</h3><ol>${c.flow.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h3>Opcions tecnològiques</h3>${c.technology.map(t=>`<p><b>${esc(t.name)}.</b> ${esc(t.role)}</p>`).join('')}<h3>Un primer pilot</h3><p>${esc(c.pilot)}</p><h3>Com comprovem la millora</h3><ul>${c.acceptance.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Indicadors que seguirem</h3><ul>${c.metrics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Qui hi participa</h3><p>${esc(fits[c.id].contribution)}</p><p>${fits[c.id].coordinator.map(id=>esc(window.ATLES_MODEL.roles.find(r=>r.id===id)?.name||id)).join(' · ')}</p><h3>Què aporten els precedents</h3>${[...c.evidence,...(c.addendum?.evidence||[])].map(e=>`<p>${esc(e.claim)}<br><b>Aplicació proposada.</b> ${esc(e.transfer)}</p>`).join('')}</section>`;}
document.getElementById('print-main').innerHTML=`<header><img src="villier-logo.svg" alt="Villier"><h1>Idees per evolucionar<br>l’observabilitat del CTTI</h1><p>Atles O11y · V5 · Octubre de 2026</p><p>${L.scope==='principal'?'Idees principals':'Catàleg complet'} · ${L.labels[L.mode]} · ${cards.length} idees</p><p>Propostes de Villier per millorar l’operació, explorar noves capacitats i comprovar-ne el valor amb els equips del CTTI.</p><p class="note">Evolució operativa parteix del marc documentat. Innovació aplicada proposa capacitats per assajar. El desplegament i la prioritat es contrasten amb els equips de cada servei.</p><div class="actions"><button id="print">Imprimeix o desa en PDF</button><a href="${esc(L.carry('index.html#atlas'))}">Torna a les idees</a></div></header>${L.scope==='principal'?`<section><h2>Una primera selecció per conversar</h2><p>Villier destaca aquestes idees per la seva utilitat, la concreció de la proposta i les evidències disponibles.</p>${E.criteria?.length?`<ul class="criteria">${E.criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</section>`:''}<h2>Les idees d’aquest recorregut</h2><ol class="toc">${cards.map(c=>`<li><a href="#${c.id}">${esc(title(c))}</a></li>`).join('')}</ol>${cards.map(c=>`<article id="${c.id}"><p class="card-reference">${esc(E.groups[c.id[0]]?.name||'')} · Referència ${c.id}</p><h2>${esc(title(c))}</h2><p class="summary">${esc(c.subtitle)}</p>${E.cards[c.id]?.benefit?`<h3>Què volem millorar</h3><p>${esc(E.cards[c.id].benefit)}</p>`:''}${L.scope==='principal'&&E.cards[c.id]?.whyPrincipal?`<p class="note">${esc(E.cards[c.id].whyPrincipal)}</p>`:''}<h3>El punt de partida al CTTI</h3><p class="base">${esc(fits[c.id].baseCtti)}</p>${L.blocks(c).map(b=>`<section class="block ${b.kind}"><p class="label">${L.labels[b.kind]} · Proposta de Villier</p><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p><p><b>Opcions tecnològiques.</b> ${esc(b.tech)}</p><p><b>Un primer pas.</b> ${esc(b.pilot)}</p><p><b>Com ho comprovem.</b> ${esc(b.check)}</p></section>`).join('')}<h3>Què necessitem per avançar</h3><p>${esc(c.caution)}</p><h3>Idees relacionades</h3>${relations(c)}${L.mode==='all'?full(c):''}<h3>Referències de la idea</h3><p>${refs(c)}</p></article>`).join('')}<section class="sources"><h2>Fonts i documents</h2><p>Les referències conserven les dates de consulta de la investigació de l’Atles. Els documents aportats es descriuen amb el seu títol i localització; els originals es consulten pels canals corresponents.</p>${sources.map(s=>`<section class="source" id="source-${s.id}"><h3>${esc(s.publisher)} · ${esc(s.title)}</h3><p>${esc(s.country)} · ${esc(s.kind)} · ${esc(s.date)}${s.accessed?' · Consulta: '+esc(s.accessed):''}</p><p>${esc(s.summary)}</p>${s.status?`<p>${esc(s.status)}</p>`:''}${s.limitation?`<p>${esc(s.limitation)}</p>`:''}<p>${s.url?`<a href="${esc(s.url)}">${esc(s.url)}</a>`:'Document aportat; original disponible pel canal de documentació.'}</p></section>`).join('')}</section>`;
document.getElementById('print').addEventListener('click',()=>window.print());document.title='Atles O11y V5 · '+L.labels[L.mode]+' · '+(L.scope==='principal'?'Idees principals':'Catàleg complet');
})();
</script></body></html>
